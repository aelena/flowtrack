name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ruff and pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        # The suite drops every table after each test, so the service database
        # is named flowtrack_test — conftest refuses to run against anything
        # whose name does not end in _test.
        image: postgres:16
        env:
          POSTGRES_USER: flowtrack
          POSTGRES_PASSWORD: flowtrack_secret
          POSTGRES_DB: flowtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowtrack -d flowtrack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://flowtrack:flowtrack_secret@localhost:5432/flowtrack_test
        run: pytest -q

  frontend:
    name: Frontend — eslint, prettier and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  compose:
    name: Stack — build and reach healthy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the template
        # If this step is all it takes, the documented quick start works.
        run: cp .env.example .env

      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Show status
        if: always()
        run: docker compose ps

      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://localhost:7028/api/health
          curl --fail --silent --show-error --output /dev/null http://localhost:7027

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Tear down
        if: always()
        run: docker compose down -v
