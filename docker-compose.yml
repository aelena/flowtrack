version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "7029:5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    ports:
      - "7028:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    # Bind the source in for development: run the tests, ruff, or edit code
    # without rebuilding the image. The named volume below still owns
    # /app/storage so uploads survive.
    volumes:
      - ./backend:/app
      - storage:/app/storage
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "7027:3000"
    depends_on:
      - api

volumes:
  pgdata:
  storage:
