# Config only. The launcher is a single stdlib script you run directly —
# nothing to build, nothing to install.

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",
    # BaseHTTPRequestHandler's method names are fixed by the base class.
    "N802",
]

[tool.pytest.ini_options]
testpaths = ["."]
